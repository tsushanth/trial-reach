name: no-data-guard
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_no_data.py
      - run: python3 -m pip install pytest openpyxl pandas numpy && python3 -m pytest -q
